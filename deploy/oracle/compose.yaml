services:
  server:
    image: screen-feedback-server:local
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_BASE_URL: https://${FEEDBACK_DOMAIN:?Set FEEDBACK_DOMAIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
      AUTH_ISSUER: ${AUTH_ISSUER:?Set AUTH_ISSUER}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:?Set AUTH_AUDIENCE}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:?Set AUTH_JWKS_URL}
      PHOTO_TICKET_KEY: ${PHOTO_TICKET_KEY:?Set PHOTO_TICKET_KEY}
    volumes:
      - feedback_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 100
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      FEEDBACK_DOMAIN: ${FEEDBACK_DOMAIN:?Set FEEDBACK_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
volumes:
  feedback_data:
  caddy_data:
  caddy_config:
