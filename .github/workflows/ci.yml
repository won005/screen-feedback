name: SDK 검증
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:check
      - run: docker build -t screen-feedback-server:ci -f deploy/oracle/Dockerfile .
      - run: docker run --rm -e FEEDBACK_DOMAIN=feedback.example.test -v "${{ github.workspace }}/deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - run: npx expo export --platform android --platform ios
        working-directory: examples/mobile
